name: ASTRAEON Unity License Readiness Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-readiness:
    name: Check Unity license prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project version and CI configuration
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | head -n 1)"
          test -n "$VERSION"
          grep -q 'game-ci/unity-builder@v4' .github/workflows/ci.yml
          grep -q 'secrets.UNITY_LICENSE' .github/workflows/ci.yml
          echo "Unity editor version: $VERSION"
          echo "Unity Android build workflow is configured."

      - name: Check whether a Unity license secret is configured
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "A UNITY_LICENSE secret is configured."
            echo "The normal CI workflow can attempt the Android APK build."
            {
              echo "## License readiness"
              echo "- UNITY_LICENSE secret is present."
              echo "- Run the normal ASTRAEON Unity CI workflow to test the Android APK build."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::UNITY_LICENSE is not configured. Unity CI can validate the project, but APK export will be skipped."
            {
              echo "## License readiness"
              echo "- UNITY_LICENSE secret is missing."
              echo "- The old game-ci/unity-request-activation-file action is retired; it cannot generate an activation file."
              echo "- Unity Personal is free, but current supported activation is through Unity Hub. This workflow cannot create a valid Personal license on its own."
              echo "- After obtaining a valid Unity license file through a supported Unity activation flow, add it to repository Settings → Secrets and variables → Actions as a secret named UNITY_LICENSE. Never commit the license file to the repository."
              echo "- Then run the ASTRAEON Unity CI workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
